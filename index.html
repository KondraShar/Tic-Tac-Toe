<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./style.css" rel="stylesheet">
    <script src="./logic.js" defer></script>
    <title>Tic-Tac-Toe</title>
</head>
<body>

    <div id="vertical-content">

        <header>
            <div id="game-title">
                <p>Tic-Tac-Toe</p>
            </div>
        </header>
    
        <main>
            <div id="gameboard">
                <!-- <div class="tile hvr-bob-sink" id="tile-1">X</div>
                <div class="tile hvr-bob-sink" id="tile-2"></div>
                <div class="tile hvr-bob-sink" id="tile-3"></div>
                <div class="tile hvr-bob-sink" id="tile-4"></div>
                <div class="tile hvr-bob-sink" id="tile-5"></div>
                <div class="tile hvr-bob-sink" id="tile-6"></div>
                <div class="tile hvr-bob-sink" id="tile-7"></div>
                <div class="tile hvr-bob-sink" id="tile-8"></div>
                <div class="tile hvr-bob-sink" id="tile-9"></div> -->
            </div>
            <button class="hvr-bob-sink" id="start-reset-round-btn">Reset</button>
        </main>

    </div>

    <section>

        <div id="info-board">
            <p id="info-board-text">Welcome to TicTacToe!<br>Play 5 rounds</p>
        </div>

        <div id="player-board">
            <div id="edit-player-name">
                <div id="player-x">
                    <p>Player X</p>
                    <input id="player-name-x" type="text" minlength="2" maxlength="20">
                </div>
                <div id="player-o">
                    <p>Player O</p>
                    <input id="player-name-o" type="text" minlength="2" maxlength="20">
                </div>
            </div>
        </div>

        <div id="score-board-container">
            <div class="player">
                <p id="player-x-name-display">X</p>
                <div class="score player-x">0</div>
            </div>
            <div id="vs">:</div>
            <div class="player">
                <p id="player-o-name-display">O</p>
            <div class="score player-o">0</div>
            </div>
        </div>

        <button  class="hvr-bob-sink" id="start-reset-game-btn">Start Game</button>
    </section>
    
</body>
</html>
